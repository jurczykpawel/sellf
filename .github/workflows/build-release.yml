name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # Run tests before building
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ./admin-panel
        run: bun install --frozen-lockfile

      - name: Install MCP server dependencies
        working-directory: ./mcp-server
        run: bun install --frozen-lockfile

      - name: Run type check
        working-directory: ./admin-panel
        run: bun run typecheck
        env:
          NODE_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Run lint
        working-directory: ./admin-panel
        run: bun run lint

      - name: Dependency audit (admin-panel)
        working-directory: ./admin-panel
        # Blocking: audits the real bun.lock (not a generated package-lock.json)
        # and fails the build on any high/critical advisory in the resolved
        # dependency tree. Use `--ignore=<advisory id>` for a specific,
        # time-bound, reviewed exception — never continue-on-error again.
        run: bun audit --audit-level=high

      - name: Dependency audit (mcp-server)
        working-directory: ./mcp-server
        # Blocking: audits the real bun.lock and fails the build on any
        # high/critical advisory in the resolved dependency tree. Use
        # `--ignore=<advisory id>` for a specific, time-bound, reviewed
        # exception — never continue-on-error again.
        run: bun audit --audit-level=high

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results verified,unknown

  verify-playerstack-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sellf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install SSH deploy key (read-only to playerstack)
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PLAYERSTACK_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts

      - name: Extract pinned playerstack commit SHA from sellf
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          SELLF_SRC_FILE="admin-panel/src/lib/playerstack.ts"
          PS_SHA=$(grep -aoE "PLAYERSTACK_COMMIT_SHA = '[a-f0-9]{40}'" "$SELLF_SRC_FILE" | grep -oE "[a-f0-9]{40}" || true)
          if [[ -z "$PS_SHA" ]]; then
            echo "::error::could not extract PLAYERSTACK_COMMIT_SHA from $SELLF_SRC_FILE" >&2
            exit 1
          fi
          echo "ps_sha=$PS_SHA" >> "$GITHUB_OUTPUT"
          echo "pinned playerstack commit: $PS_SHA"

      - name: Clone playerstack repo at pinned SHA
        run: |
          set -euo pipefail
          git clone --no-checkout git@github.com:jurczykpawel/playerstack.git /tmp/playerstack
          cd /tmp/playerstack
          git checkout --detach ${{ steps.pin.outputs.ps_sha }}
          echo "checked out: $(git rev-parse HEAD)"

      - name: Install playerstack dependencies
        working-directory: /tmp/playerstack
        run: bun install --frozen-lockfile

      - name: Build playerstack embed bundle
        working-directory: /tmp/playerstack/packages/embed
        run: bun run build

      - name: Verify bundle SRI matches sellf source of truth
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_PATH="/tmp/playerstack/packages/embed/dist/playerstack.min.js"
          if [[ ! -s "$BUNDLE_PATH" ]]; then
            echo "::error::playerstack build did not produce $BUNDLE_PATH" >&2
            exit 1
          fi

          UPSTREAM_SRI="sha384-$(openssl dgst -sha384 -binary "$BUNDLE_PATH" | openssl base64 -A)"
          UPSTREAM_SHORT="$(openssl dgst -sha256 "$BUNDLE_PATH" | awk '{print $2}' | cut -c1-12)"

          SELLF_SRC_FILE="admin-panel/src/lib/playerstack.ts"
          SELLF_SRI="$(grep -aoE "sha384-[A-Za-z0-9+/=]+" "$SELLF_SRC_FILE" | head -1 || true)"
          SELLF_BUNDLE_PATH_REL="$(grep -aoE "/vendor/playerstack/playerstack-[a-f0-9]{12}\.min\.js" "$SELLF_SRC_FILE" | head -1 || true)"

          if [[ -z "$SELLF_SRI" || -z "$SELLF_BUNDLE_PATH_REL" ]]; then
            echo "::error::could not extract integrity / bundle path from $SELLF_SRC_FILE" >&2
            exit 1
          fi

          SELLF_BUNDLE_FILE="admin-panel/public${SELLF_BUNDLE_PATH_REL}"
          if [[ ! -s "$SELLF_BUNDLE_FILE" ]]; then
            echo "::error::sellf bundle missing on disk: $SELLF_BUNDLE_FILE" >&2
            exit 1
          fi

          ON_DISK_SRI="sha384-$(openssl dgst -sha384 -binary "$SELLF_BUNDLE_FILE" | openssl base64 -A)"
          if [[ "$ON_DISK_SRI" != "$SELLF_SRI" ]]; then
            echo "::error::bundle in $SELLF_BUNDLE_FILE does not match integrity declared in $SELLF_SRC_FILE" >&2
            echo "::error::on-disk: $ON_DISK_SRI" >&2
            echo "::error::declared: $SELLF_SRI" >&2
            echo "::error::someone modified files in admin-panel/public/vendor/ or playerstack.ts manually" >&2
            exit 1
          fi

          if [[ "$UPSTREAM_SRI" != "$SELLF_SRI" ]]; then
            echo "::warning::upstream rebuild SRI differs from sellf declared — likely esbuild cross-platform non-determinism (mac arm64 vs linux x64)" >&2
            echo "::warning::upstream (rebuilt at ${{ steps.pin.outputs.ps_sha }}): $UPSTREAM_SRI ($UPSTREAM_SHORT)" >&2
            echo "::warning::sellf (declared):   $SELLF_SRI" >&2
            echo "::warning::on-disk SRI matches declared, so manual tampering is still detected; only the cross-platform rebuild check is downgraded to a warning"
          fi

          echo "✓ bundle matches playerstack@${{ steps.pin.outputs.ps_sha }}"
          echo "  bundle: $SELLF_BUNDLE_PATH_REL"
          echo "  sri:    $SELLF_SRI"

  build:
    runs-on: ubuntu-latest
    needs: [test, verify-playerstack-bundle]  # Only build if tests pass AND playerstack bundle is fresh

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: ./admin-panel
        run: bun install --frozen-lockfile

      - name: Build application
        working-directory: ./admin-panel
        run: bun run build
        env:
          NODE_ENV: production
          # Dummy values for build - real values loaded at runtime via /api/runtime-config
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://placeholder.example.com
          NEXT_PUBLIC_BASE_URL: https://placeholder.example.com
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

      - name: Check build for runtime URL placeholders
        working-directory: ./admin-panel
        run: bash scripts/check-build-artifact.sh

      - name: Package build artifacts
        working-directory: ./admin-panel
        run: |
          # Create release package
          mkdir -p ../release

          # Write version file (used by update.sh for display)
          node -p "require('./package.json').version" > ../release/version.txt

          # Copy built application
          cp -r .next ../release/
          cp package.json ../release/
          cp bun.lock ../release/ 2>/dev/null || true

          # Copy public assets
          cp -r public ../release/ 2>/dev/null || true

          # Copy necessary config files
          cp next.config.ts ../release/ 2>/dev/null || cp next.config.js ../release/ 2>/dev/null || true
          cp tsconfig.json ../release/ 2>/dev/null || true

          # Copy upgrade script
          mkdir -p ../release/scripts
          cp scripts/upgrade.sh ../release/scripts/ 2>/dev/null || true
          chmod +x ../release/scripts/upgrade.sh 2>/dev/null || true

          # Copy Supabase migrations and email templates
          mkdir -p ../release/supabase
          cp -r ../supabase/migrations ../release/supabase/ 2>/dev/null || true
          cp -r ../supabase/templates ../release/supabase/ 2>/dev/null || true

          # Create .env.example for reference
          cat > ../release/.env.example << 'EOF'
          # Sellf Environment Variables
          # Copy this file to .env.local and fill in your values

          # Supabase
          SUPABASE_URL=https://your-project.supabase.co
          SUPABASE_ANON_KEY=your-anon-key
          SUPABASE_SERVICE_ROLE_KEY=your-service-role-key

          # Public instance URL — resolved at runtime; NEXT_PUBLIC_* URL vars are unnecessary
          SITE_URL=https://your-domain.com

          # Stripe
          STRIPE_PUBLISHABLE_KEY=pk_live_xxx
          STRIPE_SECRET_KEY=sk_live_xxx
          STRIPE_WEBHOOK_SECRET=whsec_xxx

          # Cloudflare Turnstile (optional)
          CLOUDFLARE_TURNSTILE_SITE_KEY=your-site-key
          CLOUDFLARE_TURNSTILE_SECRET_KEY=your-secret-key

          # Production
          NODE_ENV=production
          PORT=3333
          EOF

          # Create startup script
          cat > ../release/start.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          # Load .env.local into shell so PM2 captures actual values.
          # dotenv in server.js won't override vars already set by PM2, so we pre-load them here.
          if [ -f .env.local ]; then
            set -o allexport
            source .env.local
            set +o allexport
          fi
          bun run start
          EOF
          chmod +x ../release/start.sh

          # Create tarball
          cd ../release
          tar -czvf ../sellf-build.tar.gz .

          # Plain checksum ("<hex>  sellf-build.tar.gz"), kept for tools that
          # read it. The signed source of truth is sellf-build.manifest below.
          cd ..
          sha256sum sellf-build.tar.gz > sellf-build.tar.gz.sha256
          cat sellf-build.tar.gz.sha256

      # Signed release manifest: exactly two lines, `version=<YYYY.M.patch>` and
      # `sha256=<hex of sellf-build.tar.gz>`, plus an Ed25519 signature over
      # it (sellf-build.manifest.sig). upgrade.sh verifies the signature with
      # the public key embedded in the already-installed script, refuses a
      # version older than the installed one, and checks the tarball against
      # the hash, so one signature covers origin, version and contents.
      - name: Write and sign release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set — refusing to publish an unsigned release"
            exit 1
          fi

          # The tag must be CalVer (optional v prefix) and match
          # admin-panel/package.json, which becomes the installed version.txt
          # the next upgrade compares against.
          if ! [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_VERSION' is not YYYY.M.patch"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./admin-panel/package.json').version")"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::release tag $RELEASE_VERSION does not match admin-panel/package.json version $PACKAGE_VERSION"
            exit 1
          fi

          printf 'version=%s\nsha256=%s\n' "$MANIFEST_VERSION" "$(sha256sum sellf-build.tar.gz | awk '{print $1}')" > sellf-build.manifest
          cat sellf-build.manifest

          umask 077
          KEY_FILE="$(mktemp)"
          PUB_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$PUB_FILE"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY_FILE"
          openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin \
            -in sellf-build.manifest -out sellf-build.manifest.sig

          # Verify against the key installed servers trust: the one embedded
          # in upgrade.sh. Catches a secret/public-key mismatch before publishing.
          sed -n '/^# release-signing-key:start/,/^# release-signing-key:end/p' admin-panel/scripts/upgrade.sh \
            | sed -n '/^-----BEGIN PUBLIC KEY-----$/,/^-----END PUBLIC KEY-----$/p' > "$PUB_FILE"
          if grep -q 'REPLACE_WITH_RELEASE_SIGNING_PUBLIC_KEY' "$PUB_FILE"; then
            echo "::error::admin-panel/scripts/upgrade.sh still holds the placeholder release signing public key"
            exit 1
          fi
          openssl pkeyutl -verify -pubin -inkey "$PUB_FILE" -rawin \
            -in sellf-build.manifest -sigfile sellf-build.manifest.sig
          cmp -s "$PUB_FILE" admin-panel/scripts/release-signing-key.pub.pem || {
            echo "::error::admin-panel/scripts/release-signing-key.pub.pem differs from the key embedded in upgrade.sh"
            exit 1
          }

      - name: Upload artifact to release
        if: github.event_name == 'release'
        run: gh release upload "${{ steps.version.outputs.VERSION }}" sellf-build.tar.gz sellf-build.tar.gz.sha256 sellf-build.manifest sellf-build.manifest.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Sellf ${{ steps.version.outputs.VERSION }}
          draft: false
          files: |
            sellf-build.tar.gz
            sellf-build.tar.gz.sha256
            sellf-build.manifest
            sellf-build.manifest.sig
          body: |
            ## Sellf ${{ steps.version.outputs.VERSION }}

            ### Installation

            ```bash
            # Download and extract
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/sellf-build.tar.gz | tar -xz -C ~/sellf-admin

            # Configure environment
            cd ~/sellf-admin
            cp .env.example .env.local
            nano .env.local  # Fill in your values

            # Install runtime dependencies
            bun install --production

            # Start with PM2
            pm2 start ./start.sh --name sellf-admin
            pm2 save
            ```

            ### What's included
            - Pre-built Next.js application (.next/)
            - Production dependencies (bun.lock)
            - Environment template (.env.example)
            - Startup script (start.sh)
            - Supabase migrations (supabase/migrations/)
            - Email templates (supabase/templates/)

            ### Requirements
            - Bun runtime
            - PM2 (recommended)
            - Configured Supabase project
            - Stripe account (for payments)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker image to GHCR
  docker:
    runs-on: ubuntu-latest
    needs: [test, verify-playerstack-bundle]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Same strict gate as the tarball manifest (build job): a malformed or
      # rc tag, or one that doesn't match admin-panel/package.json, must
      # never reach GHCR — checked before login/push, not after.
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$RELEASE_VERSION' is not YYYY.M.patch"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./admin-panel/package.json').version")"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::release tag $RELEASE_VERSION does not match admin-panel/package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sellf
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the pushed digest resolves on GHCR
        run: |
          set -euo pipefail
          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${OWNER_LOWER}/sellf@${{ steps.build.outputs.digest }}"

  # Sign the pushed image's digest so stackpilot can pin + verify it instead
  # of trusting the mutable `latest` tag. Runs after both `build` (which
  # creates the GitHub release on a manual dispatch) and `docker` (which
  # produces the digest), so a release always exists and the digest is known.
  # If `docker` fails, only this job is skipped — the tarball release stays
  # valid, and a Docker install refuses cleanly for lacking a signed image.
  sign-image:
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write and sign image manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ needs.docker.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set — refusing to publish an unsigned image manifest"
            exit 1
          fi
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::docker job did not produce a valid image digest: '$IMAGE_DIGEST'"
            exit 1
          fi

          OWNER_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          printf 'version=%s\nimage=ghcr.io/%s/sellf@%s\n' "$MANIFEST_VERSION" "$OWNER_LOWER" "$IMAGE_DIGEST" > sellf-image.manifest
          cat sellf-image.manifest

          admin-panel/scripts/ci/sign-manifest.sh sign sellf-image.manifest sellf-image.manifest.sig
          # Verify against the key installed servers trust, same as the
          # tarball manifest — catches a secret/public-key mismatch before publishing.
          admin-panel/scripts/ci/sign-manifest.sh verify sellf-image.manifest sellf-image.manifest.sig

      - name: Upload artifact to release
        run: gh release upload "${{ needs.docker.outputs.version }}" sellf-image.manifest sellf-image.manifest.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
