name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (YYYY.M.patch or YYYY.M.patch-rc.N)'
        required: true
        type: string
      prerelease:
        description: Build an explicit prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # Hard stop: Dependabot PRs that must ride in a release (runtime/major bumps labelled
  # `release-batch`, security fixes labelled `security`) cannot sit open past 24 h while a
  # release is built. See .github/workflows/dependabot-auto-merge.yml.
  dependabot-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Block on stale release-batch/security Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/dependabot" \
            --limit 200 --json number,title,createdAt,labels \
            | .github/scripts/check-dependabot-batch.sh

  # Run tests before building
  test:
    needs: dependabot-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: ./admin-panel
        run: bun install --frozen-lockfile

      - name: Version files agree with the tag
        working-directory: ./admin-panel
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: bun run release:bump --check "${RELEASE_VERSION#v}"

      - name: Run type check
        working-directory: ./admin-panel
        run: bun run typecheck
        env:
          NODE_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Run lint
        working-directory: ./admin-panel
        run: bun run lint

      - name: API contract (OpenAPI registry matches every v1 route)
        working-directory: ./admin-panel
        run: bun run test:api-contract

      - name: Dependency audit (admin-panel)
        working-directory: ./admin-panel
        # Blocking: audits the real bun.lock (not a generated package-lock.json)
        # and fails the build on any high/critical advisory in the resolved
        # dependency tree. Use `--ignore=<advisory id>` for a specific,
        # time-bound, reviewed exception — never continue-on-error again.
        # Reviewed exception (2026-10-03): GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, no
        # fixed release yet) reaches only build/dev tooling (next-intl message
        # extractor watcher, @next/eslint-plugin-next); absent from the standalone
        # build and the Docker image. Remove once a fixed braces/micromatch ships.
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --results verified,unknown

  # Blocking migration gate (AGENTS.md, Release migration policy): lint rules, migration order
  # append-only against the PREVIOUS release tag, at most 8 migrations added since it, and the
  # schema built from all migrations equal to supabase/schema.snapshot.sql.
  migrations:
    needs: dependabot-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Supabase CLI (must equal PINNED_SUPABASE_CLI in schema-snapshot.ts)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1

      - name: Migration lint against the previous release
        working-directory: ./admin-panel
        run: |
          set -euo pipefail
          MIGRATION_ORDER_BASE="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^")"
          export MIGRATION_ORDER_BASE
          echo "previous release: $MIGRATION_ORDER_BASE"
          bun run lint:migrations --release

      - name: Schema from migrations equals the snapshot
        working-directory: ./admin-panel
        run: bun run schema:check

  verify-playerstack-bundle:
    needs: dependabot-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sellf
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install SSH deploy key (read-only to playerstack)
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PLAYERSTACK_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts

      - name: Extract pinned playerstack commit SHA from sellf
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          SELLF_SRC_FILE="admin-panel/src/lib/playerstack.ts"
          PS_SHA=$(grep -aoE "PLAYERSTACK_COMMIT_SHA = '[a-f0-9]{40}'" "$SELLF_SRC_FILE" | grep -oE "[a-f0-9]{40}" || true)
          if [[ -z "$PS_SHA" ]]; then
            echo "::error::could not extract PLAYERSTACK_COMMIT_SHA from $SELLF_SRC_FILE" >&2
            exit 1
          fi
          echo "ps_sha=$PS_SHA" >> "$GITHUB_OUTPUT"
          echo "pinned playerstack commit: $PS_SHA"

      - name: Clone playerstack repo at pinned SHA
        env:
          PLAYERSTACK_SHA: ${{ steps.pin.outputs.ps_sha }}
        run: |
          set -euo pipefail
          git clone --no-checkout git@github.com:jurczykpawel/playerstack.git /tmp/playerstack
          cd /tmp/playerstack
          git checkout --detach "$PLAYERSTACK_SHA"
          echo "checked out: $(git rev-parse HEAD)"

      - name: Install playerstack dependencies
        working-directory: /tmp/playerstack
        run: bun install --frozen-lockfile

      - name: Build playerstack embed bundle
        working-directory: /tmp/playerstack/packages/embed
        run: bun run build

      - name: Verify bundle files match sellf source of truth
        env:
          PLAYERSTACK_SHA: ${{ steps.pin.outputs.ps_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DIST="/tmp/playerstack/packages/embed/dist"
          SELLF_SRC_FILE="admin-panel/src/lib/playerstack.ts"
          SELLF_SRI="$(grep -aoE "sha384-[A-Za-z0-9+/=]+" "$SELLF_SRC_FILE" | head -1 || true)"
          SELLF_BUNDLE_PATH_REL="$(grep -aoE "/vendor/playerstack/[a-f0-9]{7}/playerstack\.min\.js" "$SELLF_SRC_FILE" | head -1 || true)"

          if [[ -z "$SELLF_SRI" || -z "$SELLF_BUNDLE_PATH_REL" ]]; then
            echo "::error::could not extract integrity / bundle path from $SELLF_SRC_FILE" >&2
            exit 1
          fi

          SELLF_DIR="admin-panel/public$(dirname "$SELLF_BUNDLE_PATH_REL")"
          if [[ "$(basename "$SELLF_DIR")" != "$(echo "$PLAYERSTACK_SHA" | cut -c1-7)" ]]; then
            echo "::error::$SELLF_DIR is not named after the pinned playerstack commit" >&2
            exit 1
          fi

          ON_DISK_SRI="sha384-$(openssl dgst -sha384 -binary "$SELLF_DIR/playerstack.min.js" | openssl base64 -A)"
          if [[ "$ON_DISK_SRI" != "$SELLF_SRI" ]]; then
            echo "::error::core script in $SELLF_DIR does not match integrity declared in $SELLF_SRC_FILE" >&2
            echo "::error::on-disk: $ON_DISK_SRI" >&2
            echo "::error::declared: $SELLF_SRI" >&2
            exit 1
          fi

          # Every module (+ legal notice) must exist in sellf and be byte-identical to the fresh build.
          # List shared with scripts/sync-playerstack.sh.
          while IFS= read -r module; do
            for f in "$module" "$module.LEGAL.txt"; do
              if [[ ! -s "$DIST/$f" ]]; then
                echo "::error::playerstack build did not produce $f" >&2
                exit 1
              fi
              if [[ ! -s "$SELLF_DIR/$f" ]]; then
                echo "::error::sellf is missing $SELLF_DIR/$f" >&2
                exit 1
              fi
              if [[ "$(sha256sum < "$DIST/$f")" != "$(sha256sum < "$SELLF_DIR/$f")" ]]; then
                echo "::error::$SELLF_DIR/$f differs from the fresh playerstack build" >&2
                exit 1
              fi
            done
          done < <(grep -vE '^\s*(#|$)' admin-panel/scripts/playerstack-modules.txt)

          for f in LICENSE NOTICE; do
            if ! cmp -s "/tmp/playerstack/$f" "$SELLF_DIR/$f"; then
              echo "::error::$SELLF_DIR/$f is missing or differs from upstream" >&2
              exit 1
            fi
          done

          echo "✓ bundle matches playerstack@$PLAYERSTACK_SHA"
          echo "  dir: $SELLF_DIR"
          echo "  sri: $SELLF_SRI"

  build:
    runs-on: ubuntu-latest
    needs: [test, migrations, verify-playerstack-bundle]
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ./admin-panel
        run: bun install --frozen-lockfile

      - name: Build application
        working-directory: ./admin-panel
        run: bun run build
        env:
          NODE_ENV: production
          # Dummy values for build - real values loaded at runtime via /api/runtime-config
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://placeholder.example.com
          NEXT_PUBLIC_BASE_URL: https://placeholder.example.com
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

      - name: Check build for runtime URL placeholders
        working-directory: ./admin-panel
        run: bash scripts/check-build-artifact.sh

      - name: Package build artifacts
        working-directory: ./admin-panel
        run: |
          # Create release package
          mkdir -p ../release

          # Write version file (used by update.sh for display)
          node -p "require('./package.json').version" > ../release/version.txt

          # Copy built application
          cp -r .next ../release/
          cp package.json ../release/
          cp bun.lock ../release/ 2>/dev/null || true

          # Copy public assets
          cp -r public ../release/ 2>/dev/null || true

          # Copy necessary config files
          cp next.config.ts ../release/ 2>/dev/null || cp next.config.js ../release/ 2>/dev/null || true
          cp tsconfig.json ../release/ 2>/dev/null || true

          # Copy upgrade script
          mkdir -p ../release/scripts
          cp scripts/upgrade.sh ../release/scripts/ 2>/dev/null || true
          chmod +x ../release/scripts/upgrade.sh 2>/dev/null || true

          # Copy Supabase migrations and email templates
          mkdir -p ../release/supabase
          cp -r ../supabase/migrations ../release/supabase/ 2>/dev/null || true
          cp -r ../supabase/templates ../release/supabase/ 2>/dev/null || true

          # Create .env.example for reference
          cat > ../release/.env.example << 'EOF'
          # Sellf Environment Variables
          # Copy this file to .env.local and fill in your values

          # Supabase
          SUPABASE_URL=https://your-project.supabase.co
          SUPABASE_ANON_KEY=your-anon-key
          SUPABASE_SERVICE_ROLE_KEY=your-service-role-key

          # Public instance URL — resolved at runtime; NEXT_PUBLIC_* URL vars are unnecessary
          SITE_URL=https://your-domain.com

          # Stripe
          STRIPE_PUBLISHABLE_KEY=pk_live_xxx
          STRIPE_SECRET_KEY=sk_live_xxx
          STRIPE_WEBHOOK_SECRET=whsec_xxx

          # Cloudflare Turnstile (optional)
          CLOUDFLARE_TURNSTILE_SITE_KEY=your-site-key
          CLOUDFLARE_TURNSTILE_SECRET_KEY=your-secret-key

          # Production
          NODE_ENV=production
          PORT=3333
          EOF

          # Create startup script
          cat > ../release/start.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          # Load .env.local into shell so PM2 captures actual values.
          # dotenv in server.js won't override vars already set by PM2, so we pre-load them here.
          if [ -f .env.local ]; then
            set -o allexport
            source .env.local
            set +o allexport
          fi
          bun run start
          EOF
          chmod +x ../release/start.sh

          # Create tarball
          cd ../release
          tar -czvf ../sellf-build.tar.gz .

          # Plain checksum ("<hex>  sellf-build.tar.gz"), kept for tools that
          # read it. The signed source of truth is sellf-build.manifest below.
          cd ..
          sha256sum sellf-build.tar.gz > sellf-build.tar.gz.sha256
          cat sellf-build.tar.gz.sha256

      - name: Write release manifests
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) }}
        run: |
          set -euo pipefail
          # The tag must be CalVer (optional v prefix) and match
          # admin-panel/package.json, which becomes the installed version.txt
          # the next upgrade compares against.
          if ! [[ "$RELEASE_VERSION" =~ ^v?[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::release tag '$RELEASE_VERSION' is not YYYY.M.patch"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-rc.* ]] && [ "$PRERELEASE" != true ]; then
            echo "::error::RC requires prerelease=true"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./admin-panel/package.json').version")"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::release tag $RELEASE_VERSION does not match admin-panel/package.json version $PACKAGE_VERSION"
            exit 1
          fi

          bash admin-panel/scripts/ci/write-release-manifests.sh "$MANIFEST_VERSION" sellf-build.tar.gz .
          cat sellf-build*.manifest

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 1
          path: |
            sellf-build.tar.gz
            sellf-build.tar.gz.sha256

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-manifests
          if-no-files-found: error
          retention-days: 1
          path: |
            sellf-build*.manifest

  sign-build:
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: build-manifests

      - name: Sign manifests
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" != tag ] || ! [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::A release tag is required"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ] && [ "${DISPATCH_VERSION#v}" != "$VERSION" ]; then
            echo "::error::Dispatch version must match the release tag"
            exit 1
          fi
          [ -f sellf-build.v2.manifest ]
          for manifest in sellf-build*.manifest; do
            cat "$manifest"
            if IFS= read -r -d '' content < "$manifest"; then
              echo "::error::Invalid manifest contents"
              exit 1
            fi
            case "$manifest" in
              sellf-build.manifest) pattern=$'^version=[^\n]+\nsha256=[[:xdigit:]]{64}\n$' ;;
              sellf-build.v2.manifest) pattern=$'^version=[^\n]+\nsha256=[[:xdigit:]]{64}\nmin_updater_version=[1-9][0-9]{0,8}\n$' ;;
              *) echo "::error::Unexpected manifest name"; exit 1 ;;
            esac
            if [ "${content%%$'\n'*}" != "version=$VERSION" ] || ! [[ "$content" =~ $pattern ]]; then
              echo "::error::Invalid manifest format or version"
              exit 1
            fi
          done
          umask 077
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY_FILE"
          for manifest in sellf-build*.manifest; do
            openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in "$manifest" -out "$manifest.sig"
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-signatures
          if-no-files-found: error
          retention-days: 1
          path: |
            sellf-build*.manifest.sig

  publish-build:
    runs-on: ubuntu-latest
    needs: [build, sign-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: admin-panel/scripts

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-package

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: build-manifests

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: build-signatures

      - name: Verify release manifests
        run: |
          set -euo pipefail
          PUB_FILE="$(mktemp)"
          trap 'rm -f "$PUB_FILE"' EXIT
          sed -n '/^# release-signing-key:start/,/^# release-signing-key:end/p' admin-panel/scripts/upgrade.sh \
            | sed -n '/^-----BEGIN PUBLIC KEY-----$/,/^-----END PUBLIC KEY-----$/p' > "$PUB_FILE"
          cmp "$PUB_FILE" admin-panel/scripts/release-signing-key.pub.pem
          sha256sum -c sellf-build.tar.gz.sha256
          for manifest in sellf-build*.manifest; do
            bash admin-panel/scripts/ci/sign-manifest.sh verify "$manifest" "$manifest.sig"
            grep -qx "sha256=$(sha256sum sellf-build.tar.gz | awk '{print $1}')" "$manifest"
          done

      - name: Upload artifact to release
        if: github.event_name == 'release'
        run: gh release upload "$RELEASE_VERSION" sellf-build.tar.gz sellf-build.tar.gz.sha256 sellf-build*.manifest sellf-build*.manifest.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          GH_REPO: ${{ github.repository }}

      - name: Create release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sellf ${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            sellf-build.tar.gz
            sellf-build.tar.gz.sha256
            sellf-build*.manifest
            sellf-build*.manifest.sig
          body: |
            ## Sellf ${{ needs.build.outputs.version }}

            ### Installation

            ```bash
            # Download and extract
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.version }}/sellf-build.tar.gz | tar -xz -C ~/sellf-admin

            # Configure environment
            cd ~/sellf-admin
            cp .env.example .env.local
            nano .env.local  # Fill in your values

            # Install runtime dependencies
            bun install --production

            # Start with PM2
            pm2 start ./start.sh --name sellf-admin
            pm2 save
            ```

            ### What's included
            - Pre-built Next.js application (.next/)
            - Production dependencies (bun.lock)
            - Environment template (.env.example)
            - Startup script (start.sh)
            - Supabase migrations (supabase/migrations/)
            - Email templates (supabase/templates/)

            ### Requirements
            - Bun runtime
            - PM2 (recommended)
            - Configured Supabase project
            - Stripe account (for payments)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          GH_REPO: ${{ github.repository }}

  # Build and push Docker image to GHCR
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [test, migrations, verify-playerstack-bundle]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "VERSION=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Same strict gate as the tarball manifest (build job): an unmarked RC
      # or a tag differing from admin-panel/package.json must
      # never reach GHCR — checked before login/push, not after.
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease == true) || (github.event_name == 'workflow_dispatch' && inputs.prerelease == true) }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^v?[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::release tag '$RELEASE_VERSION' is not YYYY.M.patch"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == *-rc.* ]] && [ "$PRERELEASE" != true ]; then
            echo "::error::RC requires prerelease=true"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./admin-panel/package.json').version")"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          if [ "$MANIFEST_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::release tag $RELEASE_VERSION does not match admin-panel/package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sellf
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.PRERELEASE != 'true' && !contains(steps.version.outputs.VERSION, '-rc.') }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease && !contains(steps.version.outputs.VERSION, '-rc.') }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image manifest
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::docker job did not produce a valid image digest"
            exit 1
          fi
          OWNER_LOWER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${OWNER_LOWER}/sellf@${IMAGE_DIGEST}"
          MANIFEST_VERSION="${RELEASE_VERSION#v}"
          printf 'version=%s\nimage=ghcr.io/%s/sellf@%s\n' "$MANIFEST_VERSION" "$OWNER_LOWER" "$IMAGE_DIGEST" > sellf-image.manifest

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-manifests
          if-no-files-found: error
          retention-days: 1
          path: |
            sellf-image.manifest

  sign-image:
    runs-on: ubuntu-latest
    needs: [build, docker]
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: image-manifests

      - name: Sign manifests
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" != tag ] || ! [[ "${GITHUB_REF_NAME:-}" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::A release tag is required"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ] && [ "${DISPATCH_VERSION#v}" != "$VERSION" ]; then
            echo "::error::Dispatch version must match the release tag"
            exit 1
          fi
          manifest=sellf-image.manifest
          cat "$manifest"
          if IFS= read -r -d '' content < "$manifest"; then
            echo "::error::Invalid manifest contents"
            exit 1
          fi
          pattern=$'^version=[^\n]+\nimage=ghcr\.io/[a-z0-9_.-]+/sellf@sha256:[[:xdigit:]]{64}\n$'
          if [ "${content%%$'\n'*}" != "version=$VERSION" ] || ! [[ "$content" =~ $pattern ]]; then
            echo "::error::Invalid manifest format or version"
            exit 1
          fi
          umask 077
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY_FILE"
          for manifest in sellf-image.manifest; do
            openssl pkeyutl -sign -inkey "$KEY_FILE" -rawin -in "$manifest" -out "$manifest.sig"
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-signatures
          if-no-files-found: error
          retention-days: 1
          path: |
            sellf-image.manifest.sig

  publish-image:
    runs-on: ubuntu-latest
    needs: [docker, sign-image, publish-build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: admin-panel/scripts

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: image-manifests

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: image-signatures

      - name: Verify image manifest
        run: bash admin-panel/scripts/ci/sign-manifest.sh verify sellf-image.manifest sellf-image.manifest.sig

      - name: Upload artifact to release
        run: gh release upload "$RELEASE_VERSION" sellf-image.manifest sellf-image.manifest.sig --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.docker.outputs.version }}
