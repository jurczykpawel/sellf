name: Sellf release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate commit SHA or full Git ref
        required: true
        type: string
      stripe:
        description: Run the Stripe sandbox lanes (off while a Mac gate uses the same sandbox; the result is then not a full gate)
        required: false
        type: boolean
        default: true
      snapshots:
        description: Regenerate Linux screenshot baselines in the sections lane and upload them (never a gate result)
        required: false
        type: boolean
        default: false
      server:
        description: Browser specs run on the dev server (the suite assumes NODE_ENV!=production: E2E_MODE business tier, test captcha, FX stub) or a production build (diagnostics)
        required: false
        type: choice
        options: [dev, production]
        default: dev
      only_spec:
        description: "Diagnostic repeat instead of the gate: up to 5 comma separated tests/<file>.spec.ts[:line] (needs stripe=false; never a gate result)"
        required: false
        type: string
        default: ''
      repeat_each:
        description: Repetitions per test when only_spec is set (1-50)
        required: false
        type: string
        default: '10'

permissions:
  contents: read

concurrency:
  group: sellf-release-gate
  cancel-in-progress: false

env:
  RC_GATE_ROOT: ${{ github.workspace }}/candidate
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      checks: ${{ steps.plan.outputs.checks }}
      stripe: ${{ steps.plan.outputs.stripe }}
    steps:
      - &harness
        name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: gate
          fetch-depth: 0
          persist-credentials: false
      - name: Run gate contract tests
        run: RC_GATE_ROOT="$GITHUB_WORKSPACE/gate" python3 -B -m unittest discover -s gate/scripts/release-gate
      - name: Resolve the candidate and lane matrices
        id: plan
        env:
          RC_GATE_REF: ${{ inputs.ref }}
          RC_GATE_ONLY_SPEC: ${{ inputs.only_spec }}
          RC_GATE_REPEAT_EACH: ${{ inputs.repeat_each }}
        run: python3 -B gate/scripts/release-gate/all.py preflight

  inventory:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      counts: ${{ steps.inventory.outputs.inventory }}
    env:
      RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - *harness
      - &candidate
        name: Checkout the resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - &bun
        name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Collect the Playwright inventory
        id: inventory
        run: python3 -B gate/scripts/release-gate/all.py inventory
      - &validate-receipt
        name: Validate failure receipt
        id: receipt
        if: failure()
        run: python3 -B gate/scripts/release-gate/validate_receipt.py "$RUNNER_TEMP/release-gate/public/results.jsonl"
      - name: Upload inventory failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-inventory-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore

  checks:
    needs: [preflight, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.checks) }}
    env: &lane-env
      RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
      RC_GATE_INVENTORY: ${{ needs.inventory.outputs.counts }}
      RC_GATE_LANE: ${{ matrix.lane }}
    steps:
      - *harness
      - *candidate
      - &node
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - &supabase
        name: Setup Supabase CLI (PINNED_SUPABASE_CLI)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1
      - *bun  # last: setup-node/setup-cli re-expose the runner image Bun (~/.bun/bin, 1.3.10)
      - &host
        name: Prepare runner host
        # Runners start with ~14 GB free; the local Supabase images plus builds exhausted it
        # (run 45437357050: every lane got a runner shutdown signal during `supabase start`).
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          # Drop links left dangling by that removal (e.g. /usr/bin/dotnet); upgrade-streaming mirrors /usr/bin.
          sudo find /usr/bin /usr/sbin /usr/local/bin -maxdepth 1 -xtype l -delete
          docker image prune --all --force > /dev/null
          df -h / | tail -1; free -m | awk '/Mem/{print "mem available MB:", $7}'
          df -h /tmp /dev/shm /var/lib/docker "$RUNNER_TEMP" 2>/dev/null; mount | grep -E 'tmpfs|overlay' | head -8
          docker info --format 'docker root={{.DockerRootDir}} driver={{.Driver}}'
          # The candidate's template-author spec writes screenshots under the macOS temp path.
          sudo mkdir -p /private && sudo ln -sfn /tmp /private/tmp
          type -a bun; bun --version
          type -a supabase; supabase --version
          node --version
      - name: Run gate lane
        env:
          RC_GATE_GITHUB_TOKEN: ${{ github.token }}
          RC_GATE_UPDATE_SNAPSHOTS: ${{ inputs.snapshots }}
          RC_GATE_ONLY_SPEC: ${{ inputs.only_spec }}
          RC_GATE_REPEAT_EACH: ${{ inputs.repeat_each }}
          RC_GATE_SERVER: ${{ inputs.server }}
        run: |
          ( while sleep 15; do echo "HOST disk_free=$(df -h / | awk 'NR==2{print $4}') mem_avail_mb=$(free -m | awk '/Mem/{print $7}') load=$(cut -d' ' -f1 /proc/loadavg) shmem_mb=$(awk '/^Shmem:/{print int($2/1024)}' /proc/meminfo) cached_mb=$(awk '/^Cached:/{print int($2/1024)}' /proc/meminfo) slab_mb=$(awk '/^Slab:/{print int($2/1024)}' /proc/meminfo) dockerdir=$(sudo du -sm /var/lib/docker 2>/dev/null | cut -f1)MB top=$(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s:%dMB,", $2, $1/1024}') ctr=$(docker stats --no-stream --format '{{.Name}}:{{.MemUsage}}' 2>/dev/null | sort -t: -k2 -rh | head -3 | cut -d/ -f1 | tr '\n' ',')"; done ) &
          python3 -B gate/scripts/release-gate/all.py "$RC_GATE_LANE"
      - name: Upload generated Linux screenshot baselines
        if: always() && inputs.snapshots && matrix.lane == 'sections'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-snapshots
          path: ${{ runner.temp }}/release-gate/linux-snapshots/**/*.png
          retention-days: 3
          if-no-files-found: error
      - *validate-receipt
      - &lane-failure
        name: Upload lane failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-${{ matrix.lane }}-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore

  stripe:
    needs: [preflight, inventory]
    if: inputs.stripe && inputs.only_spec == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-gate
    strategy:
      fail-fast: false
      # One lane at a time: every lane shares the one sandbox account, and stripe-live's `stripe listen` receives
      # the events of all of them (run 45725081345: stripe-live ran 90 min beside the browser lanes, Mac 15-23 min).
      max-parallel: 1
      matrix: ${{ fromJSON(needs.preflight.outputs.stripe) }}
    env: *lane-env
    steps:
      - *harness
      - *candidate
      - *node
      - *supabase
      - *bun
      - *host
      - name: Run Stripe sandbox lane
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.STRIPE_SANDBOX_PUBLISHABLE_KEY }}
          STRIPE_SANDBOX_ACCOUNT_ID: ${{ secrets.STRIPE_SANDBOX_ACCOUNT_ID }}
          RC_GATE_SERVER: ${{ inputs.server }}
        run: python3 -B gate/scripts/release-gate/all.py "$RC_GATE_LANE"
      - *validate-receipt
      - *lane-failure

  gate-result:
    if: always()
    needs: [preflight, inventory, checks, stripe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *harness
      - name: Require successful lanes and complete Playwright coverage
        env:
          RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
          RC_GATE_INVENTORY: ${{ needs.inventory.outputs.counts }}
          RC_GATE_STATUSES: ${{ toJSON(needs) }}
        run: python3 -B gate/scripts/release-gate/all.py aggregate
      - *validate-receipt
      - name: Upload final failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-result-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore
