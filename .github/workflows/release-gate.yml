name: Sellf release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate commit SHA or full Git ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sellf-release-gate
  cancel-in-progress: false

env:
  RC_GATE_ROOT: ${{ github.workspace }}/candidate
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      checks: ${{ steps.plan.outputs.checks }}
      stripe: ${{ steps.plan.outputs.stripe }}
    steps:
      - &harness
        name: Checkout the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: gate
          fetch-depth: 0
          persist-credentials: false
      - name: Run gate contract tests
        run: RC_GATE_ROOT="$GITHUB_WORKSPACE/gate" python3 -B -m unittest discover -s gate/scripts/release-gate
      - name: Resolve the candidate and lane matrices
        id: plan
        env:
          RC_GATE_REF: ${{ inputs.ref }}
        run: python3 -B gate/scripts/release-gate/all.py preflight

  inventory:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      counts: ${{ steps.inventory.outputs.inventory }}
    env:
      RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - *harness
      - &candidate
        name: Checkout the resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - &bun
        name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Collect the Playwright inventory
        id: inventory
        run: python3 -B gate/scripts/release-gate/all.py inventory
      - &validate-receipt
        name: Validate failure receipt
        id: receipt
        if: failure()
        run: python3 -B gate/scripts/release-gate/validate_receipt.py "$RUNNER_TEMP/release-gate/public/results.jsonl"
      - name: Upload inventory failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-inventory-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore

  checks:
    needs: [preflight, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.checks) }}
    env: &lane-env
      RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
      RC_GATE_INVENTORY: ${{ needs.inventory.outputs.counts }}
      RC_GATE_LANE: ${{ matrix.lane }}
    steps:
      - *harness
      - *candidate
      - &node
        name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - &supabase
        name: Setup Supabase CLI (PINNED_SUPABASE_CLI)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1
      - *bun  # last: setup-node/setup-cli re-expose the runner image Bun (~/.bun/bin, 1.3.10)
      - name: Tool versions
        run: |
          type -a bun; bun --version; bun --revision
          type -a supabase; supabase --version
          node --version
      - name: Run gate lane
        run: python3 -B gate/scripts/release-gate/all.py "$RC_GATE_LANE"
      - *validate-receipt
      - &lane-failure
        name: Upload lane failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-${{ matrix.lane }}-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore

  stripe:
    needs: [preflight, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-gate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.preflight.outputs.stripe) }}
    env: *lane-env
    steps:
      - *harness
      - *candidate
      - *node
      - *supabase
      - *bun
      - name: Run Stripe sandbox lane
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_SANDBOX_PUBLISHABLE_KEY: ${{ secrets.STRIPE_SANDBOX_PUBLISHABLE_KEY }}
          STRIPE_SANDBOX_ACCOUNT_ID: ${{ secrets.STRIPE_SANDBOX_ACCOUNT_ID }}
        run: python3 -B gate/scripts/release-gate/all.py "$RC_GATE_LANE"
      - *validate-receipt
      - *lane-failure

  gate-result:
    if: always()
    needs: [preflight, inventory, checks, stripe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *harness
      - name: Require successful lanes and complete Playwright coverage
        env:
          RC_GATE_SHA: ${{ needs.preflight.outputs.sha }}
          RC_GATE_INVENTORY: ${{ needs.inventory.outputs.counts }}
          RC_GATE_STATUSES: ${{ toJSON(needs) }}
        run: python3 -B gate/scripts/release-gate/all.py aggregate
      - *validate-receipt
      - name: Upload final failure receipt
        if: failure() && steps.receipt.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-result-failure
          path: ${{ runner.temp }}/release-gate/public/results.jsonl
          retention-days: 3
          if-no-files-found: ignore
