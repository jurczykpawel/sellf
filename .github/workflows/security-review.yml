name: Security Review

# Posts automated review comments on same-repository PRs.

on:
  pull_request:
    branches: [main]
    # Only run on PRs that touch source code (skip docs-only changes)
    paths:
      - 'admin-panel/src/**'
      - 'admin-panel/tests/**'
      - 'supabase/migrations/**'
      - 'sellf.js'

permissions:
  contents: read

jobs:
  security:
    name: Claude Security Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main pinned 2026-05-28
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          upload-results: true
          exclude-directories: 'node_modules,.next,coverage'
          custom-security-scan-instructions: '.github/security-scan-instructions.md'
