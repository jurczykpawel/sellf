name: Dependabot Classification

# Classify and label updates for the release process; merging is reviewed.

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      - name: Classify
        id: kind
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.metadata.outputs.directory }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          pr=$(gh pr view "$PR_URL" --json body,labels)
          dir="/${DIRECTORY#/}"
          if jq -e '.labels[].name | select(. == "security")' <<<"$pr" >/dev/null \
             || jq -e '.body | test("Vulnerabilities fixed|GHSA-[0-9a-z-]+|CVE-[0-9]{4}-[0-9]+")' <<<"$pr" >/dev/null; then
            kind=security
          elif [ "$ECOSYSTEM" = "github_actions" ]; then
            kind=ci
          elif jq -e 'any(.[]; .updateType == "version-update:semver-major")' <<<"$UPDATES" >/dev/null; then
            kind=release-batch
          elif [ "$ECOSYSTEM" = "npm_and_yarn" ] && [ "$dir" = "/docs-site" ]; then
            kind=safe
          else
            kind=release-batch
          fi
          echo "ecosystem=$ECOSYSTEM dir=$dir kind=$kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Label classified PRs
        if: steps.kind.outputs.kind != 'safe'
        env:
          LABEL: ${{ steps.kind.outputs.kind }}
        run: |
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --force --color "$([ "$LABEL" = security ] && echo d73a4a || echo fbca04)" \
            --description "Dependabot update classification" >/dev/null
          gh pr edit "$PR_URL" --add-label "$LABEL"
