name: Migration lint

# Sellf merges most work locally without PRs, so this also runs on every pushed branch that
# touches migrations. The release build repeats both jobs as a blocking gate (build-release.yml).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration-order.txt'
      - 'supabase/schema.snapshot.sql'
      - 'supabase/config.toml'
      - 'admin-panel/scripts/lint-migrations.ts'
      - 'admin-panel/scripts/migration-order.ts'
      - 'admin-panel/scripts/schema-snapshot.ts'
      - '.github/workflows/lint-migrations.yml'
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/migration-order.txt'
      - 'supabase/schema.snapshot.sql'
      - 'supabase/config.toml'
      - 'admin-panel/scripts/lint-migrations.ts'
      - 'admin-panel/scripts/migration-order.ts'
      - 'admin-panel/scripts/schema-snapshot.ts'
      - '.github/workflows/lint-migrations.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The order check compares with the last release tag (git describe).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Run migration lint (rules + append-only migration order)
        working-directory: ./admin-panel
        run: bun run lint:migrations

  # Clean database from all migrations, schema compared with supabase/schema.snapshot.sql.
  # Any difference fails with the diff. Measured locally: ~23 s with cached images.
  schema-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Supabase CLI (must equal PINNED_SUPABASE_CLI in schema-snapshot.ts)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.109.1

      - name: Compare schema from migrations with the snapshot
        working-directory: ./admin-panel
        run: bun run schema:check
