name: Sync KSeF n8n example

# Prepare a patch from the ksef-gateway mirror for a maintainer to review.
on:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday morning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare mirror patch
        id: mirror
        run: |
          set -euo pipefail
          source_sha=$(git ls-remote --exit-code https://github.com/jurczykpawel/ksef-gateway.git refs/heads/main | cut -f1)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          base="https://raw.githubusercontent.com/jurczykpawel/ksef-gateway/$source_sha/examples"
          files=(n8n/sellf-ksef.json n8n/sellf-ksef-PL.json)
          for file in "${files[@]}"; do
            curl -fsSL "$base/$file" -o "$file"
            jq -es 'length == 1 and (.[0] | type == "object")' "$file" >/dev/null
          done

          if git diff --quiet -- "${files[@]}"; then
            echo 'The KSeF examples match upstream.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git diff --binary --no-ext-diff --no-textconv -- "${files[@]}" > "$RUNNER_TEMP/ksef-example.patch"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          {
            printf 'Upstream commit: %s\n\n' "$source_sha"
            echo 'Download the **ksef-example-patch** artifact and review and apply it on a branch from main.'
            echo "Run \`git apply --check ksef-example.patch\`, then \`git apply ksef-example.patch\` and open a PR for review."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch for review
        if: steps.mirror.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ksef-example-patch
          path: ${{ runner.temp }}/ksef-example.patch
          if-no-files-found: error
