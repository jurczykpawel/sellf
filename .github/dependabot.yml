version: 2
# Libraries are grouped monthly; Actions quarterly. Release classification and
# labels remain in dependabot-auto-merge.yml; every merge is reviewed.
# Bun entries track the lockfiles used by CI. Bun version updates do not
# provide Dependabot security PRs; the release audit remains a separate gate.
updates:
- package-ecosystem: bun
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
    semver-major-days: 30
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
  directories:
  - /admin-panel
- package-ecosystem: npm
  directory: /docs-site
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
    semver-major-days: 30
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    actions:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    images:
      patterns:
      - '*'
  ignore:
  - dependency-name: node
    versions:
    - '>=23'
  - dependency-name: oven/bun
    versions:
    - '>=2'
